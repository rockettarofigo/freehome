<div class="page-header">
  <h2>Settings</h2>
</div>

<div class="card settings-card">
  <h3>Add / Update Device</h3>
  
  <div class="form-group">
    <label>Device Type</label>
    <select [(ngModel)]="deviceType">
      <option value="light">Light</option>
      <option value="shutter">Shutter</option>
      <option value="tv">TV / Firestick</option>
    </select>
  </div>

  <div class="form-group">
    <label>Name</label>
    <input type="text" [(ngModel)]="deviceName" placeholder="e.g. Living Room">
  </div>

  <div class="form-group">
    <label>IP Address</label>
    <input type="text" [(ngModel)]="deviceIp" placeholder="e.g. 192.168.1.50">
  </div>

  <div class="button-group">
    <button class="btn btn-primary" (click)="saveDevice()">Save Device</button>
    <button class="btn btn-secondary" (click)="deleteDevice()">Delete Device</button>
  </div>

  <div *ngIf="message" class="message" [class.error]="isError">
    {{ message }}
  </div>
</div>
