<div class="app-container" [class.mobile-view]="isMobile">
  <!-- Desktop Sidebar -->
  <nav class="sidebar" *ngIf="!isMobile">
    <div class="logo">
      Free<span>Home</span>
    </div>
    <ul class="nav-links">
      <li><a routerLink="/dashboard" routerLinkActive="active"><span class="icon">🏠</span> Dashboard</a></li>
      <li><a routerLink="/light" routerLinkActive="active"><span class="icon">💡</span> Lights</a></li>
      <li><a routerLink="/shutter" routerLinkActive="active"><span class="icon">🪟</span> Shutters</a></li>
      <li><a routerLink="/tv" routerLinkActive="active"><span class="icon">📺</span> TV</a></li>
      <li><a routerLink="/cams" routerLinkActive="active"><span class="icon">📹</span> Cameras</a></li>
      <li><a routerLink="/solar" routerLinkActive="active"><span class="icon">☀️</span> Solar</a></li>
      <li><a routerLink="/aircon" routerLinkActive="active"><span class="icon">❄️</span> Aircon</a></li>
      <li><a routerLink="/settings" routerLinkActive="active"><span class="icon">⚙️</span> Settings</a></li>
    </ul>
  </nav>

  <!-- Mobile Header -->
  <header class="mobile-header" *ngIf="isMobile">
    <button class="back-btn" *ngIf="showBackButton" (click)="goBack()">
      <span class="icon">⬅️</span>
    </button>
    <div class="logo">
      Free<span>Home</span>
    </div>
    <div class="spacer" *ngIf="showBackButton"></div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
